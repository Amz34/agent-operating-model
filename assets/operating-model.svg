<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="Autonomy ladder and eight planes">
  <rect width="960" height="320" fill="#0d1117"/>
  <text x="24" y="36" fill="#8b949e" font-family="monospace" font-size="13">autonomy ladder</text>
  <g font-family="monospace" font-size="13">
    <g fill="#161b22" stroke="#30363d">
      <rect x="24" y="48" width="176" height="40" rx="8"/>
      <rect x="212" y="48" width="176" height="40" rx="8"/>
      <rect x="400" y="48" width="176" height="40" rx="8"/>
      <rect x="588" y="48" width="176" height="40" rx="8"/>
      <rect x="776" y="48" width="160" height="40" rx="8" stroke="#3fb950"/>
    </g>
    <g fill="#c9d1d9">
      <text x="40" y="73">L0  propose</text>
      <text x="228" y="73">L1  draft</text>
      <text x="416" y="73">L2  act + report</text>
      <text x="604" y="73">L3  act + verify</text>
      <text x="792" y="73" fill="#3fb950">L4  run plane</text>
    </g>
  </g>
  <text x="24" y="126" fill="#8b949e" font-family="monospace" font-size="13">eight planes (failure domains)</text>
  <g font-family="monospace" font-size="12">
    <g fill="#161b22" stroke="#30363d">
      <rect x="24" y="140" width="220" height="34" rx="6"/>
      <rect x="256" y="140" width="220" height="34" rx="6"/>
      <rect x="488" y="140" width="220" height="34" rx="6"/>
      <rect x="720" y="140" width="216" height="34" rx="6"/>
      <rect x="24" y="184" width="220" height="34" rx="6"/>
      <rect x="256" y="184" width="220" height="34" rx="6"/>
      <rect x="488" y="184" width="220" height="34" rx="6"/>
      <rect x="720" y="184" width="216" height="34" rx="6"/>
    </g>
    <g fill="#c9d1d9">
      <text x="36" y="161">P0  the box</text>
      <text x="268" y="161">P1  data</text>
      <text x="500" y="161">P2  model</text>
      <text x="732" y="161">P3  intelligence</text>
      <text x="36" y="205">P4  assurance</text>
      <text x="268" y="205">P5  delivery</text>
      <text x="500" y="205">P6  growth</text>
      <text x="732" y="205">P7  finance</text>
    </g>
  </g>
  <text x="24" y="256" fill="#8b949e" font-family="monospace" font-size="12">a plane granting L3+ must bind the verification + approvals contracts (audit rule E_UNGUARDED)</text>
  <text x="24" y="284" fill="#8b949e" font-family="monospace" font-size="12">24 seats - 5 contracts - 14 rule codes - stdlib only</text>
</svg>
